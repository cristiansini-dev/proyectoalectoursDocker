{% extends "layouts/base.html" %}
{% block title %}{% if mode == 'edit' %}Editar Paquete{% else %}Nuevo Paquete{% endif %}{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">{% if mode == 'edit' %}Editar Paquete{% else %}Crear Nuevo Paquete{% endif %}</h1></div>

<div class="row">
    <div class="col-lg-8 offset-lg-2">
        <div class="card">
            <div class="card-body">
                <form id="paqueteForm" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre del Paquete *</label>
                        <input type="text" id="nombre" name="nombre_paquete" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea id="descripcion" name="descripcion" class="form-control" rows="4"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="precio" class="form-label">Precio *</label>
                                <input type="number" id="precio" name="precio" class="form-control" step="0.01" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="duracion" class="form-label">Duración (días)</label>
                                <input type="number" id="duracion" name="duracion_dias" class="form-control">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
                        <button type="submit" class="btn btn-primary">{% if mode == 'edit' %}Guardar{% else %}Crear{% endif %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.form-group { margin-bottom: 20px; }
.form-label { font-weight: 600; margin-bottom: 8px; display: block; }
.form-control, .form-select { border-radius: 6px; border: 1px solid #e0e0e0; padding: 10px 15px; width: 100%; }
.form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(0, 168, 255, 0.25); outline: none; }
</style>

<script>
const ENDPOINT = '/api/paquetes';
const mode = '{{ mode }}';
const paqueteId = {{ paquete_id | default(0) }};

async function loadData() {
    if (mode === 'edit' && paqueteId) {
        const result = await fetchAPI('GET', `${ENDPOINT}/${paqueteId}`, null, true);
        if (result.ok) {
            const p = result.data;
            document.getElementById('nombre').value = p.nombre_paquete;
            document.getElementById('descripcion').value = p.descripcion || '';
            document.getElementById('precio').value = p.precio;
            document.getElementById('duracion').value = p.duracion_dias || '';
        }
    }
}

async function handleFormSubmit(event) {
    event.preventDefault();
    const form = document.getElementById('paqueteForm');
    const data = Object.fromEntries(new FormData(form));
    for (const key in data) {
        if (data[key] === '') data[key] = null;
        else if (!isNaN(data[key]) && data[key] !== null) data[key] = Number(data[key]);
    }
    
    const method = mode === 'edit' ? 'PUT' : 'POST';
    const url = mode === 'edit' ? `${ENDPOINT}/${paqueteId}` : ENDPOINT;
    const result = await fetchAPI(method, url, data, true);
    
    if (result.ok) {
        showSuccess('Operación exitosa');
        setTimeout(() => location.href = '/admin/paquetes', 1500);
    } else showError(result.data.detail || 'Error');
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
