<aside class="sidebar">
    <div class="sidebar-header">
        <a href="/admin" class="sidebar-brand">
            <i class="bi bi-building"></i>
            <span>AlecTours</span>
        </a>
    </div>
    
    <nav class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title">MÓDULOS</div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/admin" class="nav-link {% if request.url.path == '/admin' %}active{% endif %}">
                        <i class="bi bi-speedometer2"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/hoteles" class="nav-link {% if request.url.path.startswith('/admin/hoteles') %}active{% endif %}">
                        <i class="bi bi-hotel"></i>
                        <span>Hoteles</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/clientes" class="nav-link {% if request.url.path.startswith('/admin/clientes') %}active{% endif %}">
                        <i class="bi bi-people"></i>
                        <span>Clientes</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/empleados" class="nav-link {% if request.url.path.startswith('/admin/empleados') %}active{% endif %}">
                        <i class="bi bi-person-badge"></i>
                        <span>Empleados</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/usuarios" class="nav-link {% if request.url.path.startswith('/admin/usuarios') %}active{% endif %}">
                        <i class="bi bi-person-lock"></i>
                        <span>Usuarios</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/reservas" class="nav-link {% if request.url.path.startswith('/admin/reservas') %}active{% endif %}">
                        <i class="bi bi-calendar-check"></i>
                        <span>Reservas</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/paquetes" class="nav-link {% if request.url.path.startswith('/admin/paquetes') %}active{% endif %}">
                        <i class="bi bi-gift"></i>
                        <span>Paquetes</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/admin/pagos" class="nav-link {% if request.url.path.startswith('/admin/pagos') %}active{% endif %}">
                        <i class="bi bi-credit-card"></i>
                        <span>Pagos</span>
                    </a>
                </li>
            </ul>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">OTROS</div>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="/docs" class="nav-link" target="_blank">
                        <i class="bi bi-file-earmark-pdf"></i>
                        <span>API Docs</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    
    <div class="sidebar-footer">
        <button class="btn-sidebar-toggle" onclick="toggleSidebar()">
            <i class="bi bi-chevron-left"></i>
        </button>
    </div>
</aside>

<style>
.sidebar {
    width: 260px;
    background: #1a1a2e;
    color: #fff;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    transition: width 0.3s ease;
    z-index: 1000;
}

.sidebar.collapsed {
    width: 80px;
}

.sidebar-header {
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
}

.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 15px 0;
}

.nav-section {
    margin-bottom: 30px;
}

.nav-section-title {
    padding: 0 20px;
    font-size: 12px;
    font-weight: bold;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.nav-list {
    list-style: none;
    padding: 10px 0;
    margin: 0;
}

.nav-item {
    margin: 0;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    color: #aaa;
    text-decoration: none;
    transition: all 0.3s ease;
    border-left: 3px solid transparent;
}

.nav-link:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.nav-link.active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border-left-color: #00d4ff;
}

.sidebar-footer {
    padding: 15px 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-sidebar-toggle {
    background: none;
    border: none;
    color: #aaa;
    cursor: pointer;
    font-size: 20px;
    transition: color 0.3s ease;
}

.btn-sidebar-toggle:hover {
    color: #fff;
}

@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
    }
    
    .sidebar.show {
        transform: translateX(0);
    }
}
</style>

<script>
function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    sidebar.classList.toggle('collapsed');
}
</script>
